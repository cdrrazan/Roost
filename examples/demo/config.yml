# ------------------------------------------------------------------
# Demo: Rajan's laptop
# ------------------------------------------------------------------
# Fictional but realistic: Rajan runs six side projects on one laptop
# and owns two domains, rajan.dev and trackaru.com, both on
# Cloudflare. All data below is fake — copy this file, swap in your
# own paths and domains, and it works.
#
# What Rajan gets from `roost up`:
#   blog          → https://blog.rajan.dev        (Rails + MySQL)
#   shop          → https://shop.rajan.dev        (Rails + MySQL, shared DB container)
#   tiny-status   → https://status.rajan.dev      (Sinatra + Postgres)
#   portfolio     → https://portfolio.rajan.dev   (static, served by Caddy)
#   recipe-radar  → https://recipes.rajan.dev     (Next.js)
#   trackaru      → https://trackaru.com          (Django + Postgres, bare apex)
# ------------------------------------------------------------------

domain: rajan.dev

tunnel:
  name: roost
  access:
    emails:
      - rajan@rajan.dev # only Rajan can open these while iterating

defaults:
  memory: 512m

apps:
  # Bare paths ride the global domain.
  - ~/code/blog
  - ~/code/shop

  - path: ~/code/tiny-status
    domain: status.rajan.dev # nicer than tiny-status.rajan.dev

  - path: ~/code/portfolio
    domain: portfolio.rajan.dev
    memory: 128m # static files need almost nothing

  - path: ~/code/recipe-radar
    domain: recipes.rajan.dev

  # The second domain: a bare apex on its own zone.
  - path: ~/code/trackaru
    domain: trackaru.com
    memory: 768m
    env:
      TRACKARU_BETA: "true"
