# ------------------------------------------------------------------
# Demo: Jamie's laptop
# ------------------------------------------------------------------
# Fictional but realistic: Jamie runs six side projects on one laptop
# and owns two domains, jamiedev.io and trackaru.com, both on
# Cloudflare. All data below is fake — copy this file, swap in your
# own paths and domains, and it works.
#
# What Jamie gets from `roost up`:
#   blog          → https://blog.jamiedev.io        (Rails + MySQL)
#   shop          → https://shop.jamiedev.io        (Rails + MySQL, shared DB container)
#   tiny-status   → https://status.jamiedev.io      (Sinatra + Postgres)
#   portfolio     → https://portfolio.jamiedev.io   (static, served by Caddy)
#   recipe-radar  → https://recipes.jamiedev.io     (Next.js)
#   trackaru      → https://trackaru.com            (Django + Postgres, bare apex)
# ------------------------------------------------------------------

domain: jamiedev.io

tunnel:
  name: roost
  access:
    emails:
      - jamie@jamiedev.io # only Jamie can open these while iterating

defaults:
  memory: 512m

apps:
  # Bare paths ride the global domain.
  - ~/code/blog
  - ~/code/shop

  - path: ~/code/tiny-status
    domain: status.jamiedev.io # nicer than tiny-status.jamiedev.io

  - path: ~/code/portfolio
    domain: portfolio.jamiedev.io
    memory: 128m # static files need almost nothing

  - path: ~/code/recipe-radar
    domain: recipes.jamiedev.io

  # The second domain: a bare apex on its own zone.
  - path: ~/code/trackaru
    domain: trackaru.com
    memory: 768m
    env:
      TRACKARU_BETA: "true"
