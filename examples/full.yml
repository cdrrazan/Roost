# Every knob roost has, annotated. You will almost never need all of
# these — the whole point is that a path and a hostname are enough.

# Fallback domain: bare-path apps become <name>.demo.example.com.
domain: demo.example.com

# Optional: run the whole stack on a remote Docker host (a cheap VPS) instead
# of this machine, driven by this same config. roost still generates locally
# under ~/.roost/build; only WHERE containers run changes. In remote mode the
# app source is NOT bind-mounted (the VPS has no copy), so every app builds
# into its image. Any ssh://, tcp://, or unix:// Docker endpoint works; an
# explicit $DOCKER_HOST in your environment overrides this.
# remote: ssh://ubuntu@your-vps.example.com

# Optional: route this hostname through the tunnel to the `roost web`
# control panel (start/stop the fleet, add/remove apps from a browser).
# The panel is a host process outside the stack — run it always-on with
# `roost enable`'s launchd/systemd mechanism and ALWAYS put Cloudflare
# Access in front of it. Omit this key and the panel stays loopback-only.
control_host: control.example.com

tunnel:
  # Always the literal default or your own value — roost never invents
  # tunnel names, so the Cloudflare dashboard stays recognizable.
  name: roost
  # With access set, every routing suffix gets a Cloudflare Access
  # wall BEFORE the first `up`. Hostnames leak via Certificate
  # Transparency logs within hours; personal apps want this.
  access:
    emails:
      - me@example.com
      - friend@example.com

# Applied to every app unless the app overrides them.
defaults:
  memory: 512m
  profile: core

apps:
  # Bare string form: everything inferred.
  - ~/projects/blog

  # Map form with every override:
  - path: ~/work/legacy-crm
    domain: crm.example.com # verbatim FQDN, ignores the global domain
    name: crm # default: slugified folder basename
    framework: rails # default: detected from the folder
    port: 3001 # default: framework default
    database: mysql # default: detected from the app's config
    seed: true # after start: migrate every up, run bin/rails db:seed once
    # migrate: false # set this if the image runs db:prepare in its own
    #                # entrypoint — otherwise roost's prepare races it and a
    #                # multi-db app fails with "No database selected".
    #                # migrate: "<cmd>" runs your command instead.
    memory: 768m # this one needs more headroom
    profile: extras # start only with: roost up --profile extras
    env: # extra container environment
      SOME_FEATURE_FLAG: "on"
      LEGACY_MODE: "true"

  # Heavy app, parked in a profile so it doesn't start by default.
  - path: ~/experiments/ml-playground
    domain: ml.example.com
    memory: 2g
    profile: extras

  # A Next.js app that validates env at build time (e.g. @t3-oss/env).
  # build_env is set during `next build`; env is set at runtime. Keep
  # secrets in env — build_env bakes into image layers.
  #
  # migrate: and seed: both take a command string for anything that isn't a
  # Rails default. Schema creation belongs in migrate: (it runs on EVERY up,
  # including `roost up --no-seed`) — NOT in seed:, or a --no-seed clean run
  # would leave the DB with zero tables. seed: is demo data only; it runs once
  # (tracked in state.json), `roost up --reseed` re-runs it. drizzle push is
  # idempotent, so running it each up is safe.
  - path: ~/projects/webapp
    domain: app.example.com
    framework: next
    migrate: "npm run db:push"
    seed: "npm run seed"
    build_env:
      SKIP_ENV_VALIDATION: "1"
    env:
      NEXT_PUBLIC_APP_URL: https://app.example.com

  # An app that needs Redis + a background worker (Sidekiq, Solid Queue).
  # roost auto-detects Redis from the sidekiq/redis gem (redis: true/false
  # overrides) and provisions one shared redis service, injecting REDIS_URL.
  # The worker is a SECOND entry over the same path: worker: true means no
  # domain and no route, command: is the process to run. It shares the web
  # app's database — detection would give it finance_worker, so pin
  # DATABASE_URL to the web app's DB (an explicit env value wins).
  - path: ~/work/finance
    domain: finance.example.com
    migrate: false # sure's entrypoint runs db:prepare itself
    # redis: true  # only needed if detection can't see the gem/REDIS_URL
  - path: ~/work/finance
    name: finance-worker
    worker: true
    command: bundle exec sidekiq
    env:
      DATABASE_URL: "postgres://roost:roost@postgres:5432/finance"

  # A stateful app that stores files on disk (a document manager, a media
  # library) — it needs volumes:, or a rebuild wipes them. Each entry is a
  # Docker mount, source:/container/path[:ro]. A named source (data) becomes
  # a named volume, namespaced with the app name (docs-data) and declared for
  # you; a path source (/srv/x, ~/x) is a host bind mount, passed through.
  # This app also runs the official prebuilt image via a one-line wrapper
  # Dockerfile at its root, so roost builds THAT (own-Dockerfile app: no
  # source mount) and its entrypoint migrates itself (migrate: false).
  - path: ~/apps/docs
    domain: docs.example.com
    framework: django
    migrate: false
    redis: true # this app uses Redis as its task broker
    volumes:
      - data:/usr/src/paperless/data # named volume (survives rebuilds)
      - media:/usr/src/paperless/media # the document library
      - /srv/docs/consume:/usr/src/paperless/consume # host bind mount

# ------------------------------------------------------------------
# Not in this file: shared demo credentials.
# Drop a ~/.roost/seed.env (mode 0600, KEY=VALUE) and roost injects its
# pairs into every app container, so one demo super-admin logs into all
# of them. Point each app's seed script at the variables:
#
#   # ~/.roost/seed.env
#   SEED_ADMIN_EMAIL=me@example.com
#   SEED_ADMIN_PASSWORD=one-strong-shared-secret
#
# Secrets stay out of config.yml — see docs/configuration.md.
# ------------------------------------------------------------------
