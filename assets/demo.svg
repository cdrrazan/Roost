<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Terminal: roost up brings six apps online over HTTPS; roost add puts a seventh live with no DNS change">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; }
    .p  { fill: #918e85; }
    .c  { fill: #d3976f; }
    .ok { fill: #9dc4a5; }
    .t  { fill: #e8e6dd; }
    .d  { fill: #918e85; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="758" height="298" rx="14" fill="#171614" stroke="#3a3833"/>
  <circle cx="26" cy="26" r="6" fill="#57534a"/>
  <circle cx="46" cy="26" r="6" fill="#57534a"/>
  <circle cx="66" cy="26" r="6" fill="#57534a"/>

  <g class="mono">
    <text x="28" y="66"><tspan class="p">$ </tspan><tspan class="c">roost</tspan><tspan class="t"> up</tspan></text>
    <text x="28" y="92"><tspan class="ok">up:</tspan><tspan class="t"> blog          → https://blog.rajan.dev</tspan></text>
    <text x="28" y="114"><tspan class="ok">up:</tspan><tspan class="t"> shop          → https://shop.rajan.dev</tspan></text>
    <text x="28" y="136"><tspan class="ok">up:</tspan><tspan class="t"> tiny-status   → https://status.rajan.dev</tspan></text>
    <text x="28" y="158"><tspan class="ok">up:</tspan><tspan class="t"> portfolio     → https://portfolio.rajan.dev</tspan></text>
    <text x="28" y="180"><tspan class="ok">up:</tspan><tspan class="t"> recipe-radar  → https://recipes.rajan.dev</tspan></text>
    <text x="28" y="202"><tspan class="ok">up:</tspan><tspan class="t"> trackaru      → https://trackaru.com</tspan></text>

    <text x="28" y="240"><tspan class="p">$ </tspan><tspan class="c">roost</tspan><tspan class="t"> add ~/code/app7 --domain app7.rajan.dev</tspan></text>
    <text x="28" y="262"><tspan class="d"># no DNS change, no dashboard visit, no new cert — just `roost up`</tspan></text>
    <rect class="cursor" x="28" y="272" width="9" height="16" fill="#c96442"/>
  </g>
</svg>
